<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta de cerveza</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1f1d18;--mut:#6f6a5e;--bd:#e4e0d4;--ac:#d98e04;--acx:#fff;--ok:#1a7f4b;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f17;--tx:#f3efe2;--mut:#a39c88;--bd:#383425;--ac:#f0a91c;--acx:#1b1400;--ok:#4cc58a;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#17150f;--card:#221f17;--tx:#f3efe2;--mut:#a39c88;--bd:#383425;--ac:#f0a91c;--acx:#1b1400;--ok:#4cc58a;--bad:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
button{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;background:var(--ac);color:var(--acx);cursor:pointer}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:500}
.item{position:relative;display:flex;align-items:stretch;gap:8px;padding:10px 0;border-top:1px solid var(--bd);background:var(--card);transition:transform .15s}
.item:first-child{border-top:0}
.item.drag{transition:none;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:10px;opacity:.95}
.ib{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.h{display:flex;align-items:center;justify-content:center;align-self:stretch;flex:none;width:30px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;touch-action:none;cursor:grab;color:var(--mut);font-size:18px;user-select:none;-webkit-user-select:none;letter-spacing:-3px}
.nm{flex:1;min-width:0;text-align:center}.nm b{display:block;overflow-wrap:anywhere}.nm span{color:var(--mut);font-size:14px}
.q{display:flex;align-items:center;justify-content:center;gap:10px;flex-basis:100%}
.q button.w{width:auto;padding:0 18px;font-size:18px}
.q button.g{font-size:22px}
.q button{width:48px;height:48px;padding:0;font-size:26px}
.q output{min-width:46px;padding:8px 0;border-radius:10px;text-align:center;font-weight:700;font-size:22px}
.ic{min-width:34px;background:transparent;color:var(--mut);padding:6px;font-size:18px}
.edit{display:block;padding:10px 0;border-top:1px solid var(--bd)}
.edit:first-child{border-top:0}
.edit .row{margin-top:8px}.edit .row button{flex:1;padding:10px}
.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tot{font-size:36px;font-weight:800;margin:2px 0 4px}
.lbl{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:8px 12px;font-size:14px}
.res{margin-top:12px;padding:12px;border-radius:10px;font-size:20px;font-weight:700;text-align:center}
.res.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.res.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.sum .sh{justify-content:flex-start;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.sum{margin:12px 0 2px;padding:8px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:16px}
.sum div+div{border-top:1px solid var(--bd)}
.sum b{font-weight:700;color:var(--ac);margin-right:6px}
.sum span{color:var(--mut);font-size:14px;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:10px 0}
.imp{margin-top:10px;padding:12px;border:1px solid var(--ac);border-radius:10px}
.imp .row{margin-top:8px;flex-wrap:wrap}.imp button{flex:1;padding:10px;font-size:14px}
.new{background:#16a34a;color:#fff;font-size:18px;font-weight:800;padding:15px 14px;box-shadow:0 3px 10px rgba(22,163,74,.4)}
.new:active{transform:scale(.98)}
.sm{padding:8px 12px;font-size:14px}
.c2{color:var(--bad)!important;border-color:var(--bad)!important}
.xrow{margin:10px 0 4px}
.hv{border-top:1px solid var(--bd);padding:8px 0}
.hv:first-child{border-top:0}
.hv summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;list-style:none;font-weight:700}
.hv summary::-webkit-details-marker{display:none}
.hv summary span{color:var(--mut);font-weight:500;font-size:14px}
.hb{margin-top:6px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.hl{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}
.hl small{color:var(--mut)}
.hl.t{font-weight:700;border-top:1px dashed var(--bd);margin-top:4px;padding-top:6px}
.hl.ok{color:var(--ok);font-weight:700}
.hl.bad{color:var(--bad);font-weight:700}
.th{width:52px;height:52px;flex:none;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:20px}
.th span{opacity:.35}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.xd{padding:10px 14px;color:var(--bad);border-color:var(--bad)}
#cchip{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;width:46px;height:46px;padding:0;border-radius:50%;background:#475569;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#cwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
#cback{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#calc{position:relative;width:min(340px,100%);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.chd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#cx{background:transparent;color:var(--mut);border:1px solid var(--bd);width:40px;height:40px;padding:0;font-size:20px}
#cdisp{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-align:right;min-height:88px;margin-bottom:10px;overflow:hidden}
#cexp{font-size:24px;font-weight:600;word-break:break-all;min-height:32px}
#cres{font-size:20px;color:var(--mut);min-height:28px}
#cpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#cpad button{padding:0;height:56px;font-size:22px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#cpad .op{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#cpad .eq{grid-row:span 2;height:auto;background:#16a34a;color:#fff;border-color:#16a34a}
#cpad .z{grid-column:span 2}
[hidden]{display:none!important}
.q output.on{background:#16a34a;color:#fff}
#chip{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:#16a34a;color:#fff;font-size:18px;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#chip small{font-weight:600;font-size:12px;opacity:.9;margin-right:6px}
#chip.idle{background:#2563eb}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<h1>🍺 Cuenta de cerveza</h1>

<div class="card">
<div class="row" style="justify-content:space-between;align-items:flex-start"><h2 style="margin:6px 0 0">Cobro</h2><button class="g sm" id="xbtn">Añadir cobro adicional</button></div>
<div id="xlist"></div>
<div class="lbl" style="margin-top:8px">Total a cobrar</div>
<div class="tot" id="total">$0</div>
<div class="lbl" id="brk" hidden></div>
<div id="sum"></div>
<label class="lbl" for="rec" style="display:block;margin-top:12px">💵 Dinero recibido</label>
<input id="rec" inputmode="numeric" placeholder="$0" autocomplete="off">
<div class="chips" id="chips"></div>
<div class="res" id="res" hidden></div>
<div class="row" style="margin-top:12px"><button id="clear" class="new" style="flex:1">Nueva venta</button></div>
</div>

<div class="card" id="sale">
<h2>Venta actual</h2>
<div class="lbl" id="hint" style="margin:-4px 0 6px"></div>
<div id="list"></div>
</div>

<div class="card">
<h2>Agregar producto</h2>
<div class="col">
<input id="pn" placeholder="Nombre (ej. Águila 330 ml)" autocomplete="off">
<input id="pp" inputmode="numeric" placeholder="Precio (ej. 3.500)" autocomplete="off">
<div class="row"><div class="th" id="nprev"><span>📷</span></div><button class="g" id="nimg" style="flex:1">Elegir imagen (opcional)</button><button class="g" id="nrm" hidden>Quitar</button></div>
<button id="add">Agregar producto</button>
</div>
</div>

<div class="card">
<div class="row" style="justify-content:space-between;align-items:flex-start"><h2 style="margin:6px 0 0">Historial de ventas</h2><button class="g sm c2" id="hclr">Limpiar historial</button></div>
<div class="row" style="justify-content:space-between;align-items:center;margin:6px 0 8px"><div class="lbl" id="hsum"></div><button class="g sm" id="hall" hidden style="flex:none">Ver todo</button></div>
<div id="hlist"></div>
</div>

<div class="card">
<h2>Copia de seguridad</h2>
<div class="row">
<button class="g" id="exp" style="flex:1">Exportar</button>
<button class="g" id="impf" style="flex:1">Importar archivo</button>
</div>
<input type="file" id="file" accept=".json,application/json,text/plain" hidden>
<div class="lbl" style="margin:10px 0 6px">También puedes copiar o pegar la lista aquí:</div>
<textarea id="ta" placeholder="Pega aquí tu copia de productos…" spellcheck="false"></textarea>
<div class="row" style="margin-top:8px">
<button class="g" id="copy" style="flex:1">Copiar lista</button>
<button class="g" id="impt" style="flex:1">Importar texto</button>
</div>
<div class="row" style="margin-top:8px"><button class="g" id="rst" style="flex:1">Restaurar lista original</button></div>
<div id="imp"></div>
</div>
</main>
<button id="cchip" aria-label="Calculadora"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><rect x="8" y="5" width="8" height="4"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg></button>
<button id="chip" aria-label="Ir arriba">Sin venta</button>
<div id="cwrap" hidden>
<div id="cback"></div>
<div id="calc" role="dialog" aria-label="Calculadora">
<div class="chd"><b>Calculadora</b><button id="cx" aria-label="Cerrar calculadora">✕</button></div>
<div id="cdisp"><div id="cexp">0</div><div id="cres"></div></div>
<div id="cpad">
<button data-k="C">C</button><button data-k="B" aria-label="Borrar">⌫</button><button class="op" data-k="÷">÷</button><button class="op" data-k="×">×</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="−">−</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="+">+</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="eq" data-k="=">=</button>
<button data-k="0">0</button><button data-k="00">00</button><button data-k=".">,</button>
</div>
</div>
</div>
<div id="toast"></div>
<input type="file" id="fimg" accept="image/*" hidden>

<script>
(function(){
var KEY="cuenta-cerveza-v1";
var products=[],qty={},editing=null,lastE={},confirmDel=null,pending=null,dl=null;
var baseSig="";
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.products)){products=s.products;baseSig=s.baseSig||"";}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({products:products,baseSig:baseSig}));}catch(e){}}
try{if(window.claude&&claude.use)claude.use("downloads").then(function(d){dl=d;}).catch(function(){});}catch(e){}

function dots(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");}
function money(n){return "$"+dots(n);}
function digits(v){return parseInt(String(v).replace(/\D/g,""),10)||0;}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var $=function(i){return document.getElementById(i);};
var rec=$("rec"),list=$("list"),tt,recHist=[];
var extras=[];
function extra(){return extras.reduce(function(a,x){return a+x.v;},0);}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";clearTimeout(tt);tt=setTimeout(function(){t.className="";},2600);}
function numInput(el,sign){el.addEventListener("input",function(){var n=digits(el.value);el.value=n?(sign?"$":"")+dots(n):"";});}
numInput(rec,true);numInput($("pp"),false);

function total(){return products.reduce(function(a,p){return a+p.price*(qty[p.id]||0);},0);}
function units(){return products.reduce(function(a,p){return a+(qty[p.id]||0);},0);}

var editImg,imgTarget=null,newImg="";
function thumbHTML(img){return img?'<img src="'+img+'" alt="">':'<span>📷</span>';}
function readImg(file,cb){
 var rd=new FileReader();
 rd.onerror=function(){toast("No se pudo leer la imagen");};
 rd.onload=function(){
  var im=new Image();
  im.onerror=function(){toast("Imagen no válida");};
  im.onload=function(){
   var S=160,c=document.createElement("canvas");c.width=c.height=S;
   var w=im.width,h=im.height,m=Math.min(w,h),ctx=c.getContext("2d");
   ctx.fillStyle="#fff";ctx.fillRect(0,0,S,S);
   ctx.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,S,S);
   cb(c.toDataURL("image/jpeg",0.75));
  };
  im.src=rd.result;
 };
 rd.readAsDataURL(file);
}
function prevNew(){$("nprev").innerHTML=thumbHTML(newImg);$("nrm").hidden=!newImg;}
function renderList(){
 $("hint").textContent=products.length>1?"Arrastra ⋮⋮ para ordenar · ✎ para editar":"";
 if(!products.length){list.innerHTML='<div class="empty">Agrega tu primer producto abajo 👇</div>';return;}
 list.innerHTML=products.map(function(p){
  if(editing===p.id){
   return '<div class="edit" data-id="'+p.id+'"><input id="en" value="'+esc(p.name)+'" placeholder="Nombre" autocomplete="off">'+
   '<input id="ep" style="margin-top:8px" inputmode="numeric" value="'+dots(p.price)+'" placeholder="Precio" autocomplete="off">'+
   '<div class="row" style="align-items:center"><div class="th" id="eprev">'+thumbHTML(p.img)+'</div><button class="g" data-a="im">Cambiar imagen</button><button class="g" data-a="ri">Quitar imagen</button></div>'+
   '<div class="row"><button data-a="s">Guardar</button><button class="g" data-a="c">Cancelar</button></div>'+
   '<div class="row"><button class="danger" data-a="d">'+(confirmDel===p.id?"¿Seguro? Toca para eliminar":"Eliminar producto")+'</button></div></div>';
  }
  var q=qty[p.id]||0;
  return '<div class="item" data-id="'+p.id+'"><span class="h" aria-label="Arrastrar para ordenar">⋮⋮</span>'+
  '<div class="ib">'+
  '<div class="th">'+thumbHTML(p.img)+'</div>'+
  '<div class="nm"><b>'+esc(p.name)+'</b><span>'+money(p.price)+(q?' · '+money(p.price*q):'')+'</span></div>'+
  '<button class="ic" data-a="e" aria-label="Editar">✎</button>'+
  '<div class="q"><button class="g" data-a="z" aria-label="Reiniciar contador">↺</button><button data-a="m" aria-label="Quitar">−</button><output class="'+(q>0?'on':'')+'">'+q+'</output><button data-a="p" aria-label="Sumar">+</button><button class="w" data-a="p2" aria-label="Sumar 2">+2</button></div></div></div>';
 }).join("");
}
function renderTotals(){
 var sub=total(),ex=extra(),t=sub+ex,u=units();
 $("total").textContent=money(t);
 var brk=$("brk");brk.hidden=!ex;brk.textContent=ex?"Productos "+money(sub)+(extras.length>1?" + adicionales ":" + adicional ")+money(ex):"";
 var chip=$("chip");chip.className=t?"":"idle";chip.innerHTML=t?'<small>Total</small>'+money(t):"Sin venta";
 var sel=products.filter(function(p){return (qty[p.id]||0)>0;});
 $("sum").innerHTML=sel.length?'<div class="sum"><div class="sh">'+u+(u===1?" unidad":" unidades")+'</div>'+sel.map(function(p){var q=qty[p.id];return '<div><div style="display:block;padding:0"><b>'+q+' ×</b>'+esc(p.name)+'</div><span>'+money(p.price*q)+'</span></div>';}).join("")+'</div>':'<div class="lbl" style="margin-top:10px">Sin productos seleccionados</div>';
 var chips=[{l:"Exacto",v:t,k:"ex"}];
 var B=[100,200,500,1000,2000,5000,10000,20000,50000,100000];
 B.forEach(function(v,i){
  var f=i/(B.length-1),l=Math.round(88-70*f);
  chips.push({l:"+ "+money(v),v:v,k:"add",bg:"hsl(142,"+Math.round(55+15*f)+"%,"+l+"%)",fg:l<55?"#fff":"#0b2e1a"});
 });
 chips.push({l:"↶ Deshacer",v:0,k:"undo",c:"c2"},{l:"Limpiar",v:0,k:"clr",c:"c2"});
 $("chips").innerHTML=chips.map(function(c){return '<button class="g '+(c.c||"")+'"'+(c.bg?' style="background:'+c.bg+';color:'+c.fg+';border-color:'+c.bg+';font-weight:600"':'')+' data-k="'+c.k+'" data-v="'+c.v+'">'+c.l+'</button>';}).join("");
 var r=digits(rec.value),res=$("res");
 if(!t||!rec.value){res.hidden=true;return;}
 res.hidden=false;
 if(r>=t){res.className="res ok";res.textContent="Vueltos: "+money(r-t);}
 else{res.className="res bad";res.textContent="Faltan: "+money(t-r);}
}
function renderImp(){
 var el=$("imp");
 if(!pending){el.innerHTML="";return;}
 el.innerHTML='<div class="imp"><b>'+pending.length+(pending.length===1?" producto encontrado":" productos encontrados")+'</b>'+
 '<div class="row"><button data-i="r">Reemplazar mi lista</button><button class="g" data-i="a">Agregar a mi lista</button><button class="g" data-i="c">Cancelar</button></div></div>';
}
function render(){renderList();renderTotals();renderImp();}

list.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var row=b.closest("[data-id]"),id=row.dataset.id,a=b.dataset.a;
 if(a==="p")qty[id]=(qty[id]||0)+1;
 else if(a==="p2")qty[id]=(qty[id]||0)+2;
 else if(a==="z")qty[id]=0;
 else if(a==="m")qty[id]=Math.max(0,(qty[id]||0)-1);
 else if(a==="e"){
  var now=Date.now();
  if(lastE.id===id&&now-lastE.t<700){editing=id;confirmDel=null;lastE={};editImg=undefined;}
  else{lastE={id:id,t:now};toast("Toca dos veces para editar");return;}
 }
 else if(a==="im"){imgTarget=id;$("fimg").click();return;}
 else if(a==="ri"){editImg="";var ep=$("eprev");if(ep)ep.innerHTML=thumbHTML("");return;}
 else if(a==="c"){editing=null;confirmDel=null;editImg=undefined;}
 else if(a==="s"){
  var n=$("en").value.trim(),pr=digits($("ep").value);
  if(!n||!pr){toast("Escribe un nombre y un precio mayor a 0");return;}
  products.forEach(function(p){if(p.id===id){p.name=n;p.price=pr;if(editImg!==undefined){if(editImg)p.img=editImg;else delete p.img;}}});
  editImg=undefined;
  editing=null;confirmDel=null;save();
 }else if(a==="d"){
  if(confirmDel!==id){confirmDel=id;}
  else{products=products.filter(function(x){return x.id!==id;});delete qty[id];editing=null;confirmDel=null;save();}
 }
 render();
});
list.addEventListener("input",function(e){if(e.target.id==="ep"){var n=digits(e.target.value);e.target.value=n?dots(n):"";}});

 var h=e.target.closest(".h");if(!h)return;
 e.preventDefault();
 var items=[].slice.call(list.querySelectorAll(".item")),el=h.closest(".item"),from=items.indexOf(el);
 var sy=window.scrollY;
 var rs=items.map(function(i){var r=i.getBoundingClientRect();return{top:r.top+sy,h:r.height};});
 var slot=from<items.length-1?rs[from+1].top-rs[from].top:(from>0?rs[from].top-rs[from-1].top:rs[from].h);
 drag={el:el,items:items,from:from,to:from,rs:rs,slot:slot,y0:e.clientY+sy,pid:e.pointerId};
 el.classList.add("drag");buzz(60);
 try{h.setPointerCapture(e.pointerId);}catch(x){}
});
list.addEventListener("pointermove",function(e){
 if(!drag||e.pointerId!==drag.pid)return;
 var py=e.clientY+window.scrollY,dy=py-drag.y0,d=drag;
 d.el.style.transform="translateY("+dy+"px)";
 var to=0;
 d.items.forEach(function(it,i){if(i!==d.from&&py>d.rs[i].top+d.rs[i].h/2)to++;});
 d.to=to;
 d.items.forEach(function(it,i){
  if(i===d.from)return;
  var ni=i-(i>d.from?1:0);
  it.style.transform=ni>=to?"translateY("+d.slot+"px)":"";
 });
 if(e.clientY<70)window.scrollBy(0,-10);else if(e.clientY>window.innerHeight-70)window.scrollBy(0,10);
});
function endDrag(e){

/* Exportar / importar */
function payload(){return JSON.stringify({app:"cuenta-cerveza",version:1,products:products.map(function(p){var o={name:p.name,price:p.price};if(p.img)o.img=p.img;return o;})},null,2);}
$("exp").addEventListener("click",function(){
 if(!products.length){toast("No hay productos para exportar");return;}
 var data=payload();$("ta").value=data;
 if(!dl){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="productos.json";document.body.appendChild(a);a.click();a.remove();toast("Archivo descargado ✓");}catch(e){toast("Copia el texto de abajo para guardarlo");}return;}
 dl.save({filename:"productos.json",data:data}).then(function(){toast("Copia guardada ✓");}).catch(function(err){
  if(err&&err.code==="declined")return;
  toast("No se pudo descargar. Copia el texto de abajo");
 });
});
$("copy").addEventListener("click",function(){
 if(!products.length){toast("No hay productos para copiar");return;}
 var ta=$("ta");ta.value=payload();ta.focus();ta.select();
 var ok=false;try{ok=document.execCommand("copy");}catch(e){}
 if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){toast("Lista copiada ✓");},function(){toast("Selecciona y copia el texto");});return;}
 toast(ok?"Lista copiada ✓":"Selecciona y copia el texto");
});
function parseImport(txt){
 var d;try{d=JSON.parse(txt);}catch(e){return null;}
 var arr=Array.isArray(d)?d:(d&&d.products);
 if(!Array.isArray(arr))return null;
 var out=[];
 arr.forEach(function(p){
  if(!p)return;
  var n=String(p.name==null?"":p.name).trim().slice(0,80),pr=Math.round(Number(p.price));
  var im=(typeof p.img==="string"&&p.img.length<300000&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(p.img))?p.img:"";
  if(n&&pr>0){var o={id:uid(),name:n,price:pr};if(im)o.img=im;out.push(o);}
 });
 return out.length?out:null;
}
function startImport(txt){
 var r=parseImport(txt);
 if(!r){toast("No se encontraron productos válidos");return;}
 pending=r;renderImp();
}

/* Historial de ventas */
var HKEY="cuenta-cerveza-hist-v1",hist=[];
try{hist=JSON.parse(localStorage.getItem(HKEY)||"[]");if(!Array.isArray(hist))hist=[];}catch(e){hist=[];}
function saveHist(){try{localStorage.setItem(HKEY,JSON.stringify(hist));}catch(e){}}
function saveSale(){
 var sub=total(),ex=extra(),t=sub+ex;
 if(!t)return;
 var items=products.filter(function(p){return (qty[p.id]||0)>0;}).map(function(p){return{name:p.name,price:p.price,qty:qty[p.id]};});
 var exs=extras.filter(function(x){return x.v>0;}).map(function(x){return x.v;});
 hist.push({t:Date.now(),items:items,extras:exs,sub:sub,ex:ex,total:t,rec:digits(rec.value)});
 if(hist.length>300)hist=hist.slice(-300);
 saveHist();renderHist();
}
function renderHist(){
 var sum=hist.reduce(function(a,h){return a+h.total;},0);
 $("hsum").textContent=hist.length?hist.length+(hist.length===1?" venta":" ventas")+" · Total vendido "+money(sum):"Aún no hay ventas. Se guardan al tocar Nueva venta.";
 $("hlist").innerHTML=hist.map(function(h,i){return {h:h,n:i+1};}).reverse().map(function(o){
  var h=o.h,d=new Date(h.t),f="";
  try{f=d.toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});}catch(e){f=d.toLocaleString();}
  var b=h.items.map(function(it){return '<div class="hl"><div>'+it.qty+' × '+esc(it.name)+' <small>a '+money(it.price)+'</small></div><div>'+money(it.price*it.qty)+'</div></div>';}).join("");
  b+=h.extras.map(function(v,k){return '<div class="hl"><div>Cobro adicional'+(h.extras.length>1?" "+(k+1):"")+'</div><div>'+money(v)+'</div></div>';}).join("");
  b+='<div class="hl t"><div>Total</div><div>'+money(h.total)+'</div></div>';
  if(h.rec){
   b+='<div class="hl"><div>Dinero recibido</div><div>'+money(h.rec)+'</div></div>';
   b+=h.rec>=h.total?'<div class="hl ok"><div>Vueltos</div><div>'+money(h.rec-h.total)+'</div></div>':'<div class="hl bad"><div>Faltaron</div><div>'+money(h.total-h.rec)+'</div></div>';
  }else b+='<div class="hl"><div><small>Sin dinero recibido registrado</small></div><div></div></div>';
  return '<details class="hv"><summary><div>Venta #'+o.n+' <span>· '+esc(f)+'</span></div><div>'+money(h.total)+'</div></summary><div class="hb">'+b+'</div></details>';
 }).join("");
 updateHall();
}

/* Calculadora */
var cx="",cdone=false,cerr=false,OPS="+−×÷";
function cTrim(t){return OPS.indexOf(t.slice(-1))>-1?t.slice(0,-1):t;}
function cFmt(r){return String(parseFloat(r.toFixed(8))).replace("-","−");}
function cPretty(t){return t.replace(/\d+\.?\d*/g,function(m){var a=m.split("."),i=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");return a.length>1?i+","+a[1]:i;});}
function cCalc(t){
 if(!t||t==="−")return null;
 var parts=t.split(/([+−×÷])/),nums=[],ops=[],i;
 if(parts[0]===""&&parts[1]==="−"){parts.splice(0,2);parts[0]="-"+parts[0];}
 for(i=0;i<parts.length;i++){
  if(i%2===0){var n=parseFloat(parts[i]);if(isNaN(n))return null;nums.push(n);}else ops.push(parts[i]);
 }
 var n2=[nums[0]],o2=[];
 for(i=0;i<ops.length;i++){
  if(ops[i]==="×")n2[n2.length-1]*=nums[i+1];
  else if(ops[i]==="÷")n2[n2.length-1]/=nums[i+1];
  else{o2.push(ops[i]);n2.push(nums[i+1]);}
 }
 var r=n2[0];
 for(i=0;i<o2.length;i++)r=o2[i]==="+"?r+n2[i+1]:r-n2[i+1];
 return r;
}
function cRender(){
 $("cexp").textContent=cPretty(cx)||"0";
 var res="";
 if(cerr)res="Error";
 else if(!cdone){
  var t=cTrim(cx);
  if(/.[+−×÷]/.test(t)){var r=cCalc(t);if(r!==null&&isFinite(r))res="= "+cPretty(cFmt(r));}
 }
 $("cres").textContent=res;
}
function cKey(k){
 cerr=false;
 var last=cx.slice(-1),isOp=OPS.indexOf(k)>-1;
 if(k==="C"){cx="";cdone=false;}
 else if(k==="B"){cx=cx.slice(0,-1);cdone=false;}
 else if(k==="="){
  var r=cCalc(cTrim(cx));
  if(r===null)return;
  if(!isFinite(r)){cx="";cdone=false;cerr=true;}
  else{cx=cFmt(r);cdone=true;}
 }
 else if(isOp){
  if(!cx){if(k==="−")cx="−";}
  else if(cx==="−"){}
  else if(OPS.indexOf(last)>-1)cx=cx.slice(0,-1)+k;
  else cx+=k;
  cdone=false;
 }
 else if(k==="00"){
  if(cdone){cx="0";cdone=false;}
  else{var c3=cx.split(/[+−×÷]/).pop();if(c3==="0")return;cx+=(c3===""?"0":"00");}
 }
 else if(k==="."){
  if(cdone){cx="0.";cdone=false;}
  else{var cur=cx.split(/[+−×÷]/).pop();if(cur.indexOf(".")>-1)return;cx+=(cur===""?"0.":".");}
 }
 else{
  if(cdone){cx=k;cdone=false;}
  else{
   if(cx.length>=30)return;
   var c2=cx.split(/[+−×÷]/).pop();
   if(c2==="0")cx=cx.slice(0,-1)+k;else cx+=k;
  }
 }
 cRender();
}
$("cpad").addEventListener("click",function(e){var b=e.target.closest("button");if(b)cKey(b.dataset.k);});
$("cchip").addEventListener("click",function(){$("cwrap").hidden=false;cRender();});

document.addEventListener("keydown",function(e){if(e.key==="Escape")$("cwrap").hidden=true;});

function sig(l){var t=JSON.stringify(l.map(function(p){return[p.name,p.price,p.img||""];})),h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h);}
function getList(){
 return fetch("api/productos",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){if(!parseImport(t))throw 0;return t;}).catch(function(){
  return fetch("productos.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.text();});
 });
}
function loadRemote(force){
 return getList().then(function(t){
  var l=parseImport(t);if(!l)throw 0;
  var sg=sig(l);
  if(force||sg!==baseSig){products=l;baseSig=sg;qty={};editing=null;save();render();if(force)toast("Lista restaurada ✓");}
 }).catch(function(){if(force)toast("No se pudo leer la lista de productos");});
}

$("rst").addEventListener("click",function(){
 var b=this;
 if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="¿Seguro? Toca otra vez";clearTimeout(rt);rt=setTimeout(function(){b.dataset.s="";b.textContent="Restaurar lista original";},3000);return;}
 b.dataset.s="";b.textContent="Restaurar lista original";loadRemote(true);
});
render();
renderHist();
loadRemote(false);
})();
